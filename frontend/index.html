<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>论文 idea 讨论助手</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/stream.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header><span class="brand">AgentWorkflow</span><h1>论文 idea 讨论助手</h1><p>从已有方向与论文出发，逐步明确研究问题和实践思路。</p><p id="health">正在连接后端…</p></header>
  <main>
    <aside>
      <section>
        <h2>我的讨论</h2>
        <label>历史会话<select id="sessions" aria-label="历史会话"></select></label>
        <div class="actions"><button id="new-session">新建讨论</button><button id="delete-session" class="secondary">删除当前讨论</button></div>
        <p id="session-id" class="muted"></p>
      </section>
      <section>
        <h2>已有论文</h2><p class="muted">论文保存在本地 SQLite，供各讨论共享；资源条件分别保存。</p>
        <div class="actions"><label>查找论文<input id="paper-search" placeholder="标题、DOI 或笔记"></label><button id="find-papers" class="secondary">查找</button></div>
        <div id="library"></div>
        <details><summary>登记 / 编辑论文</summary>
          <form id="paper-form">
            <label>论文标题<input id="paper-title" required maxlength="1000"></label>
            <div class="fields"><label>年份<input id="paper-year" type="number"></label><label>DOI<input id="paper-doi"></label></div>
            <label>摘要 / 已读段落<textarea id="paper-abstract" rows="4" maxlength="50000"></textarea></label>
            <label>阅读笔记<textarea id="paper-notes" rows="2" maxlength="10000"></textarea></label>
            <button type="submit">保存论文</button><button id="paper-reset" type="button" class="secondary">清空</button>
          </form>
        </details>
        <label>导入论文 JSON<input id="import-papers" type="file" accept=".json"></label>
        <details><summary>解析论文 PDF</summary>
          <label>选择 PDF<input id="paper-pdf" type="file" accept=".pdf,application/pdf"></label>
          <div class="fields"><label>起始页<input id="pdf-start" type="number" min="1" value="1"></label><label>结束页（可选）<input id="pdf-end" type="number" min="1"></label></div>
          <p class="muted">单次最多20页、文件20 MiB；支持文字型 PDF。解析后请核对标题和原文，再点击“保存论文”。</p>
          <button id="parse-pdf" type="button" class="secondary">解析到论文表单</button>
          <p id="pdf-status" role="status" class="muted"></p>
        </details>
      </section>
    </aside>
    <div class="workspace">
      <section>
        <h2>研究方向与当前条件</h2>
        <label>专业方向<input id="direction" placeholder="例如：边缘端模型推理" maxlength="1000"></label>
        <label>当前研究命题<input id="claim" placeholder="尚未确定也可以先留空" maxlength="2000"></label>
        <div class="fields"><label>时间（周）<input id="weeks" type="number" min="1" max="520"></label><label>算力<input id="compute" placeholder="例如：CPU" maxlength="1000"></label><label>数据条件<input id="dataset" placeholder="例如：公开数据集" maxlength="1000"></label></div>
        <p class="muted">更正条件时修改这里的值，再发送消息；未修改的条件沿用原值。</p>
      </section>
      <section>
        <h2>多轮讨论</h2>
        <label>提问策略 Skill<select id="skill" aria-label="提问策略 Skill"></select></label>
        <div id="messages" role="log" aria-live="polite"></div>
        <div id="dialogue" aria-live="polite"></div>
        <ol id="progress" aria-label="本轮执行进度" aria-live="polite"></ol>
        <div id="stream-preview" hidden><p id="stream-caption" class="muted"></p><p id="stream-text" class="message assistant"></p></div>
        <form id="chat-form">
          <label>本轮输入<textarea id="message" required rows="3" maxlength="10000" placeholder="说说你的方向、最近读的论文，或继续追问…"></textarea></label>
          <label>论文检索关键词（可选）<input id="search" maxlength="500" placeholder="填写后，本轮先检索论文；留空则使用已有材料"></label>
          <div class="actions"><label class="check"><input id="use-model" type="checkbox" checked>调用已配置模型（关闭仅做离线演示）</label><button type="submit">发送</button></div>
        </form>
        <p id="status" role="status" class="muted"></p>
        <button id="retry-chat" type="button" class="secondary" hidden>核对原会话并重试</button>
      </section>
      <section><h2>材料与执行过程</h2><p id="execution-status" class="muted"></p><div id="proposal"></div><div id="evidence"></div><details><summary>查看本轮工具输入和输出</summary><pre id="trace">尚未执行</pre></details></section>
    </div>
  </main>
</body>
</html>
